[project]
name = "memory"
version = "0.1.0"
description = "Organize all memories about one person as dated Markdown, with local audio transcription and summaries."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "tomli-w>=1",
  "faster-whisper>=1.1",
  "ai_lab @ git+https://github.com/DawnEver/ai-lab.git",
  "av<16",
]

[project.scripts]
memory = "memory.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
